name: KOSPI 대형주 외신 뉴스 일일 자동 갱신

on:
  schedule:
    # 22:00 UTC = 07:00 KST (다음날) — isabelnet(06:30 KST)과 겹치지 않게
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/stock_news/requirements.txt

      - name: 대형주 5종목 외신 뉴스 수집 + 한글 번역
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/stock_news/fetch_stock_news.py

      - name: 변경사항 있으면 commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          if git diff --cached --quiet; then
            echo "변경된 내용 없음, 커밋 생략"
          else
            git commit -m "news: KOSPI 대형주 외신 뉴스 $(TZ=Asia/Seoul date +'%Y-%m-%d') (자동)"
            git push
          fi
