name: herencia-ta 유지 핑 (Render 콜드스타트 방지)

on:
  schedule:
    # 10분 간격, 07~24시 KST(=22-23,0-14시 UTC)만 핑 — herencia-ta(Render 무료 티어)가
    # 15분 넘게 요청이 없으면 잠들어서, 다음 요청(스크리너 로딩)이 콜드스타트로 수십 초
    # 걸리는 문제를 예방한다. 새벽 시간대는 실사용이 드물어 Render 무료 인스턴스 시간을
    # 아끼려고 핑 대상에서 뺐다.
    - cron: '*/10 22-23,0-14 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: herencia-ta 헬스체크 핑
        run: |
          curl -sf --max-time 55 https://herencia-ta.onrender.com/api/stocks -o /dev/null \
            && echo "herencia-ta 응답 OK" \
            || echo "herencia-ta 핑 실패(일시적일 수 있음) — 다음 주기에 재시도"
