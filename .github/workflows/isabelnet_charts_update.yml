name: ISABELNET 오늘의 차트 일일 자동 갱신

on:
  schedule:
    # 21:30 UTC = 06:30 KST (다음날)
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/isabelnet_charts/requirements.txt

      - name: ISABELNET 블로그 최신 차트 5개 수집
        run: python scripts/isabelnet_charts/fetch_charts.py

      - name: 변경사항 있으면 commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/isabelnet-charts public/data/isabelnet_charts.json
          if git diff --cached --quiet; then
            echo "변경된 내용 없음, 커밋 생략"
          else
            git commit -m "isabelnet: 오늘의 차트 $(date +'%Y-%m-%d') (자동)"
            git push
          fi
