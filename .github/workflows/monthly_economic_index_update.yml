name: JS Economic Cycle Index 월간 자동 갱신

on:
  schedule:
    # 매달 5일 22:00 UTC = 6일 07:00 KST. FRED 지표 대부분 월초에 갱신되므로
    # 며칠 여유를 두고 실행 (UMCSENT/MICH/NEWORDER/M2SL은 전월 데이터가 당월 초중순 발표).
    - cron: '0 22 5 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/economic_index/requirements.txt

      - name: FRED 지표 재수집 + 종합지수 재계산
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/economic_index/update_index.py

      - name: 변경사항 있으면 commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index-data/*.csv
          if git diff --cached --quiet; then
            echo "변경된 내용 없음, 커밋 생략"
          else
            git commit -m "JS Economic Cycle Index 월간 자동 갱신 $(date +'%Y-%m-%d')"
            git push
          fi
